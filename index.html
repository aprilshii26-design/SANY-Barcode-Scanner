<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANY BARCODE SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f2f4f7;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    h2 {
      margin: 0 0 6px;
      text-align: center;
      color: #bd2026;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 9px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    button, .file-button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: block;
      text-align: center;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .primary {
      background: #bd2026;
      color: white;
    }

    .secondary {
      background: #e9edf2;
      color: #222;
    }

    .success {
      background: #18864b;
      color: white;
    }

    .danger {
      background: #b42318;
      color: white;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .button-row button {
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd0d8;
      border-radius: 9px;
      font-size: 17px;
      margin-top: 8px;
    }

    .result {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 9px;
      margin-top: 12px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .photo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .file-button {
      background: #e9edf2;
      color: #222;
    }

    .file-button input {
      display: none;
    }

    .photo-info {
      color: #666;
      font-size: 13px;
      margin-top: 9px;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .photo-card {
      position: relative;
      border: 1px solid #ddd;
      border-radius: 9px;
      overflow: hidden;
      background: #f7f7f7;
    }

    .photo-card img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    .photo-name {
      padding: 6px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .remove-photo {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 29px;
      height: 29px;
      padding: 0;
      border-radius: 50%;
      background: #b42318;
      color: white;
      font-size: 18px;
    }

    .status {
      padding: 12px;
      margin-top: 15px;
      border-radius: 9px;
      font-size: 14px;
      display: none;
      overflow-wrap: anywhere;
    }

    .status.info {
      display: block;
      background: #e8f1ff;
      color: #174ea6;
    }

    .status.ok {
      display: block;
      background: #e6f4ea;
      color: #137333;
    }

    .status.error {
      display: block;
      background: #fce8e6;
      color: #b3261e;
    }

    .small-note {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>SANY BARCODE SCANNER</h2>
  <div class="subtitle">DO Scanning & Document Upload</div>

  <div class="section">
    <div class="section-title">1. Scan Barcode DO</div>

    <div id="reader"></div>

    <div class="button-row">
      <button id="startButton" class="primary" onclick="startScanner()">
        MULAI SCAN
      </button>

      <button id="stopButton" class="secondary" onclick="stopScanner()" disabled>
        STOP
      </button>
    </div>

    <input
      type="text"
      id="doNumber"
      placeholder="DO Number akan muncul di sini"
      autocomplete="off"
    >

    <div class="small-note">
      Barcode dapat dipindai menggunakan kamera HP. DO Number juga bisa diketik manual.
    </div>
  </div>


  <div class="section">
    <div class="section-title">2. Upload Foto Dokumen</div>

    <div class="photo-actions">

      <label class="file-button">
        📷 FOTO KAMERA
        <input
          type="file"
          id="cameraInput"
          accept="image/*"
          capture="environment"
        >
      </label>

      <label class="file-button">
        🖼️ PILIH GALERI
        <input
          type="file"
          id="galleryInput"
          accept="image/*"
          multiple
        >
      </label>

    </div>

    <div class="photo-info" id="photoCount">
      Foto dipilih: 0 / 10
    </div>

    <div class="small-note">
      Maksimal 10 foto per DO. Foto kamera dan galeri bisa digabung.
      Foto akan dikompres sebelum dikirim.
    </div>

    <div id="preview"></div>
  </div>


  <div class="section">
    <button id="saveButton" class="success" onclick="saveScan()">
      SIMPAN DATA DO
    </button>

    <div id="status" class="status"></div>
  </div>

</div>


<!-- Iframe untuk menerima respons Apps Script -->
<iframe
  name="backendFrame"
  id="backendFrame"
  style="display:none"
></iframe>

<!-- Form pengiriman ke Apps Script -->
<form
  id="backendForm"
  method="POST"
  target="backendFrame"
  action="https://script.google.com/macros/s/AKfycbwUk2aluccFwaLyYeu7h9pOGenqOWWrGGjVcREJdyxnqUl8a6InK_KYHLnIpYQ8D-L7jQ/exec"
>
  <input type="hidden" name="payload" id="payload">
</form>


<script>
  const MAX_PHOTOS = 10;
  const MAX_PHOTO_BYTES = 350 * 1024;

  let photos = [];
  let scanner = null;
  let scannerRunning = false;
  let saving = false;
  let requestTimeout = null;


  // Tampilkan status
  function showStatus(message, type) {
    const status = document.getElementById("status");

    status.textContent = message;
    status.className = "status " + type;
  }


  // Mulai scanner
  async function startScanner() {
    if (scannerRunning) return;

    try {
      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      const formats = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF
      ];

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 280, height: 140 },
          formatsToSupport: formats
        },
        async decodedText => {
          document.getElementById("doNumber").value = decodedText.trim();

          showStatus("Barcode berhasil dibaca: " + decodedText, "ok");

          await stopScanner();
        },
        () => {}
      );

      scannerRunning = true;
      document.getElementById("startButton").disabled = true;
      document.getElementById("stopButton").disabled = false;

      showStatus("Kamera aktif. Arahkan ke barcode DO.", "info");

    } catch (error) {
      showStatus(
        "Kamera tidak dapat dibuka. Periksa izin kamera browser. " + error,
        "error"
      );
    }
  }


  // Hentikan scanner
  async function stopScanner() {
    if (!scanner || !scannerRunning) return;

    try {
      await scanner.stop();
      scanner.clear();
    } catch (error) {
      console.log("Scanner stop:", error);
    }

    scannerRunning = false;

    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
  }


  // Kompres foto
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = event => {
        const img = new Image();

        img.onload = () => {
          const maxDimension = 1280;
          let width = img.width;
          let height = img.height;

          if (width > maxDimension || height > maxDimension) {
            const ratio = Math.min(
              maxDimension / width,
              maxDimension / height
            );

            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.72;

          function makeJpeg() {
            canvas.toBlob(blob => {
              if (!blob) {
                reject(new Error("Foto gagal dikompres."));
                return;
              }

              if (blob.size > MAX_PHOTO_BYTES && quality > 0.35) {
                quality -= 0.08;
                makeJpeg();
                return;
              }

              if (blob.size > MAX_PHOTO_BYTES) {
                reject(
                  new Error(
                    "Ukuran foto masih terlalu besar. Coba foto ulang."
                  )
                );
                return;
              }

              const compressedReader = new FileReader();

              compressedReader.onload = () => {
                resolve(compressedReader.result);
              };

              compressedReader.onerror = () => {
                reject(new Error("Foto gagal diproses."));
              };

              compressedReader.readAsDataURL(blob);

            }, "image/jpeg", quality);
          }

          makeJpeg();
        };

        img.onerror = () => {
          reject(new Error("File foto tidak dapat dibaca."));
        };

        img.src = event.target.result;
      };

      reader.onerror = () => {
        reject(new Error("File foto gagal dibuka."));
      };

      reader.readAsDataURL(file);
    });
  }


  // Tambahkan foto dari kamera atau galeri
  async function addFiles(fileList) {
    const files = Array.from(fileList || []);

    if (files.length === 0) return;

    const remaining = MAX_PHOTOS - photos.length;

    if (remaining <= 0) {
      showStatus("Maksimal 10 foto per DO.", "error");
      return;
    }

    const selectedFiles = files.slice(0, remaining);

    if (files.length > remaining) {
      showStatus(
        "Hanya " + remaining + " foto yang bisa ditambahkan karena batas maksimal 10 foto.",
        "info"
      );
    }

    try {
      showStatus("Sedang memproses foto...", "info");

      for (const file of selectedFiles) {
        if (!file.type.startsWith("image/")) {
          continue;
        }

        const data = await compressPhoto(file);

        photos.push({
          name: file.name,
          data: data,
          preview: data
        });
      }

      renderPhotos();

      if (photos.length > 0) {
        showStatus("Foto siap disimpan.", "ok");
      }

    } catch (error) {
      showStatus(error.message || "Gagal memproses foto.", "error");
    }
  }


  // Tampilkan preview
  function renderPhotos() {
    const preview = document.getElementById("preview");
    const count = document.getElementById("photoCount");

    preview.innerHTML = "";

    count.textContent = "Foto dipilih: " + photos.length + " / " + MAX_PHOTOS;

    photos.forEach((photo, index) => {
      const card = document.createElement("div");
      card.className = "photo-card";

      const img = document.createElement("img");
      img.src = photo.preview;
      img.alt = "Foto " + (index + 1);

      const name = document.createElement("div");
      name.className = "photo-name";
      name.textContent = "FOTO " + (index + 1) + " - " + photo.name;

      const remove = document.createElement("button");
      remove.className = "remove-photo";
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "Hapus foto";

      remove.onclick = () => {
        photos.splice(index, 1);
        renderPhotos();
      };

      card.appendChild(img);
      card.appendChild(remove);
      card.appendChild(name);

      preview.appendChild(card);
    });
  }


  // Input kamera
  document.getElementById("cameraInput").addEventListener("change", async event => {
    await addFiles(event.target.files);
    event.target.value = "";
  });


  // Input galeri
  document.getElementById("galleryInput").addEventListener("change", async event => {
    await addFiles(event.target.files);
    event.target.value = "";
  });


  // Kirim permintaan ke Apps Script
  function sendRequest(requestData) {
    if (saving) return;

    saving = true;

    document.getElementById("saveButton").disabled = true;

    showStatus("Mengirim data ke Google. Mohon tunggu...", "info");

    document.getElementById("payload").value =
      JSON.stringify(requestData);

    clearTimeout(requestTimeout);

    requestTimeout = setTimeout(() => {
      saving = false;
      document.getElementById("saveButton").disabled = false;

      showStatus(
        "Belum menerima respons dari server. Periksa Google Sheets sebelum mencoba ulang agar tidak membuat data ganda.",
        "error"
      );
    }, 120000);

    document.getElementById("backendForm").submit();
  }


  // Terima respons dari Apps Script
window.addEventListener("message", event => {
window.addEventListener("message", event => {
  let result = event.data;

  // Baca respons JSON jika dikirim sebagai teks
  if (typeof result === "string") {
    try {
      result = JSON.parse(result);
    } catch (error) {
      return;
    }
  }

  // Hanya proses respons dengan format yang diharapkan
  if (
    !result ||
    typeof result.success !== "boolean"
  ) {
    return;
  }

  clearTimeout(requestTimeout);

  saving = false;
  document.getElementById("saveButton").disabled = false;

  if (result.success) {
    showStatus(
      "BERHASIL! DO " + result.doNumber +
      " sudah tersimpan. Jumlah foto: " +
      result.totalPhotos,
      "ok"
    );

    document.getElementById("doNumber").value = "";
    photos = [];
    renderPhotos();

  } else {
    showStatus(
      result.message || "Data gagal disimpan.",
      "error"
    );
  }
});
  let result = event.data;

  // Antisipasi jika respons diterima sebagai teks
  if (typeof result === "string") {
    try {
      result = JSON.parse(result);
    } catch (error) {
      return;
    }
  }

  // Pastikan format respons benar
  if (
    !result ||
    typeof result.success !== "boolean"
  ) {
    return;
  }

  clearTimeout(requestTimeout);

  saving = false;
  document.getElementById("saveButton").disabled = false;

  if (result.success) {
    showStatus(
      "BERHASIL! DO " + result.doNumber +
      " sudah tersimpan. Jumlah foto: " +
      result.totalPhotos,
      "ok"
    );

    document.getElementById("doNumber").value = "";

    photos = [];
    renderPhotos();

  } else {
    showStatus(
      result.message || "Data gagal disimpan.",
      "error"
    );
  }
});


  // Simpan DO
  function saveScan() {
    if (saving) return;

    const doNumber = document
      .getElementById("doNumber")
      .value
      .trim();

    if (!doNumber) {
      showStatus("DO Number wajib diisi.", "error");
      return;
    }

    if (photos.length > MAX_PHOTOS) {
      showStatus("Maksimal 10 foto per DO.", "error");
      return;
    }

    const confirmation = confirm(
      "Simpan DO " + doNumber +
      " dengan " + photos.length + " foto?"
    );

    if (!confirmation) return;

    sendRequest({
      action: "submitScan",
      doNumber: doNumber,
      photos: photos.map(photo => photo.data)
    });
  }

</script>

</body>
</html>
